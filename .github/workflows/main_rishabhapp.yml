name: Build and deploy Node.js app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package application
        run: zip -r release.zip . -x '.git/*' 'node_modules/*' 'release.zip'

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: release.zip
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Configure the two repository secrets before enabling this job:
    # AZURE_WEBAPP_NAME and AZURE_WEBAPP_PUBLISH_PROFILE.
    if: ${{ secrets.AZURE_WEBAPP_NAME != '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
